name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # Node 22 ships npm 10 and Node 24 ships npm 11, and the two talk to
      # different registry audit endpoints (/security/audits/quick vs
      # /security/advisories/bulk). Pin one npm so both matrix entries audit
      # through the same path.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The registry audit endpoints flake (503s, 400s, timeouts). Retry only
      # that failure mode — a real advisory fails the gate on the first pass.
      - name: Audit production dependencies
        run: |
          for attempt in 1 2; do
            if out=$(npm audit --omit=dev 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            grep -q "audit endpoint returned an error" <<< "$out" || exit 1
            echo "::warning::npm audit registry error (attempt $attempt/2)"
          done
          exit 1

  # Single stable gate for branch protection — stays valid as the matrix changes.
  ci:
    name: CI
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify matrix succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more matrix jobs failed."
            exit 1
          fi
          echo "All matrix jobs passed."
